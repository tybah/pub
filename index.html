<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Snapshots</title>
<style>
:root{--bg:#0d1117;--panel:#161b22;--line:#30363d;--fg:#c9d1d9;--dim:#8b949e;--acc:#58a6ff;--warn:#d29922}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#f6f8fa;--panel:#fff;--line:#d0d7de;--fg:#1f2328;--dim:#656d76;--acc:#0969da;--warn:#9a6700}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
header{position:sticky;top:0;z-index:2;background:var(--panel);border-bottom:1px solid var(--line);padding:8px 16px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
h1{font-size:15px;margin:0;color:var(--acc)}
.tabs{display:flex;flex-wrap:wrap;gap:4px}
button,select,input[type=password]{background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:4px 10px;font:inherit}
button,select{cursor:pointer}
.tabs button.on{border-color:var(--acc);color:var(--acc)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;width:100%}
input[type=range]{flex:1;min-width:140px;accent-color:var(--acc)}
#t{min-width:60px;font-weight:bold}
#live.on{background:var(--acc);color:var(--bg);border-color:var(--acc)}
#status{color:var(--dim);font-size:12px}
.warn{color:var(--warn)}
main{padding:12px 16px;overflow-x:auto}
#img{display:block;max-width:100%;height:auto;margin:0 auto;border:1px solid var(--line);cursor:zoom-in}
#img.full{max-width:none;cursor:zoom-out}
#empty{color:var(--dim);padding:40px 0;text-align:center}
#lock{max-width:340px;margin:18vh auto 0;padding:0 16px;display:flex;flex-direction:column;gap:10px}
#lock input[type=password]{padding:8px 10px}
#lock label{color:var(--dim);font-size:12px;display:flex;gap:6px;align-items:center}
#app[hidden],#lock[hidden]{display:none}
</style>
</head><body>
<form id="lock" autocomplete="off">
  <h1>Snapshots</h1>
  <input type="password" id="pw" placeholder="Password" aria-label="Password" autofocus>
  <label><input type="checkbox" id="remember"> Remember on this browser</label>
  <button type="submit" id="unlock">Unlock</button>
  <span id="lockmsg" class="warn"></span>
</form>
<div id="app" hidden>
<header>
  <h1>Snapshots</h1>
  <div class="tabs" id="tabs"></div>
  <div class="ctl">
    <select id="day" aria-label="Day"></select>
    <button id="prev" title="Previous (left arrow)">&#9664;</button>
    <input type="range" id="slider" min="0" max="0" value="0" aria-label="Time">
    <button id="next" title="Next (right arrow)">&#9654;</button>
    <span id="t">--:--</span>
    <button id="live" title="Follow the latest snapshot">Live</button>
    <button id="lockbtn" title="Forget the password on this browser">Lock</button>
    <span id="status"></span>
  </div>
</header>
<main><img id="img" alt="Dashboard snapshot" title="Click to zoom"><div id="empty" hidden>No snapshots for this page on this day.</div></main>
</div>
<script>
// Everything under snaps/ and manifest.bin is AES-256-GCM (12-byte IV + ciphertext + tag); the key is
// PBKDF2-SHA256(password, crypt.json salt, crypt.json iter). Written by core/dash_publish.py.
const $ = id => document.getElementById(id);
const store = (k, v) => { try { v === undefined ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} };
const load_ = k => { try { return localStorage.getItem(k) || sessionStorage.getItem(k); } catch (e) { return null; } };
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
let KEY = null, C = null, M = null, page = load_("page"), day = null, idx = 0, live = true, shown = null, url = null;

async function fetchBin(path) {
  const r = await fetch(path + "?t=" + Date.now(), { cache: "no-store" });
  if (!r.ok) throw new Error(path + " " + r.status);
  return new Uint8Array(await r.arrayBuffer());
}
async function dec(blob) {
  return new Uint8Array(await crypto.subtle.decrypt({ name: "AES-GCM", iv: blob.slice(0, 12) }, KEY, blob.slice(12)));
}
async function keyFrom(pw) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", hash: "SHA-256", salt: b64(C.salt), iterations: C.iter },
                                 base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
}
async function rawKey(k) { return btoa(String.fromCharCode(...new Uint8Array(await crypto.subtle.exportKey("raw", k)))); }
async function importRaw(s) { return crypto.subtle.importKey("raw", b64(s), "AES-GCM", true, ["decrypt"]); }

async function check() {
  try { return new TextDecoder().decode(await dec(b64(C.check))) === "dash-publish-ok"; } catch (e) { return false; }
}

async function start() {
  try { C = await (await fetch("crypt.json?t=" + Date.now(), { cache: "no-store" })).json(); }
  catch (e) { $("lockmsg").textContent = "Nothing published yet."; return; }
  const saved = load_("k:" + C.salt);
  if (saved) { try { KEY = await importRaw(saved); if (await check()) return open_(); } catch (e) {} }
  KEY = null;
}
$("lock").onsubmit = async e => {
  e.preventDefault();
  if (!C) return;
  $("unlock").disabled = true; $("lockmsg").textContent = "";
  try {
    KEY = await keyFrom($("pw").value);
    if (!(await check())) { KEY = null; $("lockmsg").textContent = "Wrong password."; return; }
    const raw = await rawKey(KEY);
    if ($("remember").checked) store("k:" + C.salt, raw); else { try { sessionStorage.setItem("k:" + C.salt, raw); } catch (e) {} }
    $("pw").value = "";
    open_();
  } catch (err) { $("lockmsg").textContent = "Could not unlock: " + err.message; }
  finally { $("unlock").disabled = false; }
};
$("lockbtn").onclick = () => {
  store("k:" + C.salt); try { sessionStorage.removeItem("k:" + C.salt); } catch (e) {}
  location.reload();
};

function open_() { $("lock").hidden = true; $("app").hidden = false; refresh(); setInterval(refresh, 60000); }
function stems() { return (M && M.days[day] && M.days[day][page]) || []; }
function lastDay() { return Object.keys(M.days).sort().pop(); }

async function show() {
  const s = stems();
  $("slider").max = Math.max(0, s.length - 1);
  if (live) idx = s.length - 1;
  idx = Math.min(Math.max(idx, 0), Math.max(0, s.length - 1));
  $("slider").value = idx;
  $("live").classList.toggle("on", live);
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.p === page));
  if (!s.length) { $("img").hidden = true; $("empty").hidden = false; $("t").textContent = "--:--"; return; }
  $("t").textContent = s[idx].slice(0, 2) + ":" + s[idx].slice(2) + " PT";
  const path = `snaps/${day}/${page}/${s[idx]}.bin`;
  if (path === shown) return;
  shown = path;
  try {
    const img = await dec(await fetchBin(path));
    if (shown !== path) return;                     // a newer click won
    if (url) URL.revokeObjectURL(url);
    url = URL.createObjectURL(new Blob([img], { type: "image/jpeg" }));
    $("img").src = url; $("img").hidden = false; $("empty").hidden = true;
  } catch (e) { shown = null; $("status").textContent = "could not load " + s[idx]; $("status").className = "warn"; }
}

function build() {
  const days = Object.keys(M.days).sort().reverse();
  if (!day || !M.days[day] || live) day = days[0];
  $("day").innerHTML = days.map(d => `<option>${d}</option>`).join("");
  $("day").value = day || "";
  if (!page || !M.pages.includes(page)) page = M.pages[0];
  $("tabs").innerHTML = M.pages.map(p => `<button data-p="${p}">/${p}</button>`).join("");
  document.querySelectorAll("#tabs button").forEach(b => b.onclick = () => {
    const t = stems()[idx];
    page = b.dataset.p; store("page", page);
    if (!live && t) { const s = stems(); const j = s.findIndex(x => x >= t); idx = j < 0 ? s.length - 1 : j; }
    show();
  });
  show();
}

async function refresh() {
  try {
    M = JSON.parse(new TextDecoder().decode(await dec(await fetchBin("manifest.bin"))));
    build();
    $("status").textContent = `published ${M.updated.slice(5, 16)} PT`; $("status").className = "";
  } catch (e) {
    $("status").textContent = "could not load the snapshot list (password changed? press Lock)"; $("status").className = "warn";
  }
}

$("day").onchange = e => { day = e.target.value; live = day === lastDay(); idx = 0; show(); };
$("slider").oninput = e => { idx = +e.target.value; live = idx === stems().length - 1 && day === lastDay(); show(); };
$("prev").onclick = () => { idx--; live = false; show(); };
$("next").onclick = () => { idx++; live = false; show(); };
$("live").onclick = () => { live = true; day = lastDay(); $("day").value = day; show(); };
$("img").onclick = () => $("img").classList.toggle("full");
document.addEventListener("keydown", e => {
  if ($("app").hidden || e.target.tagName === "SELECT" || e.target.tagName === "INPUT" && e.target.type !== "range") return;
  if (e.key === "ArrowLeft") $("prev").click();
  if (e.key === "ArrowRight") $("next").click();
});
start();
</script>
</body></html>
